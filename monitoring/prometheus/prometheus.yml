global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'recommendation-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    
  - job_name: 'ml-training'
    static_configs:
      - targets: ['ml-training:8080']
      
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
      
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
      
  - job_name: 'spark'
    static_configs:
      - targets: ['spark-master:8080']
